# Builds and (on version tags) publishes the PyPI package.
# Version is derived automatically from git tags via setuptools-scm.
# Publishing uses OIDC Trusted Publishing — no API token secrets needed.
# To enable: go to https://pypi.org/manage/project/ssh-ansible/settings/publishing/
# and add a trusted publisher:
#   Owner: marekruzicka  Repository: ansible-ssh
#   Workflow: build_pypi.yml  Environment: pypi

name: Build PyPI Package

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # required for setuptools-scm to read git tags

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package with twine
      run: twine check dist/*

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    environment: pypi
    permissions:
      id-token: write  # required for OIDC Trusted Publishing

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
